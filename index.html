<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkUp - Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- PWA STUFF - THIS MAKES IT INSTALLABLE -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00a884">
  
  <style>
    body { background-color: #0b141a; color: #e9edef; }
    .topbar { background-color: #202c33; }
    .chat-list { background-color: #111b21; }
    .chat-window { background-color: #0b141a; background-image: url('https://user-images.githubusercontent.com/15082567/134272853-4c3f5d0a-7a8a-4c8a-9a8a-4c3f5d0a7a8a.png'); }
    .msg-sent { background-color: #005c4b; }
    .msg-received { background-color: #202c33; }
  </style>
</head>
<body class="h-screen flex flex-col">

  <!-- HEADER WITH INSTALL BUTTON -->
  <header class="topbar p-4 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">LinkUp</h1>
      <p id="myIdSmall" class="text-xs text-gray-400"></p>
    </div>
    <div class="flex gap-2">
      <button onclick="installApp()" id="installBtn" class="hidden bg-[#00a884] px-3 py-1 rounded-full text-sm font-bold">Install</button>
      <button onclick="openProfile()"><i data-lucide="settings" class="w-6 h-6"></i></button>
    </div>
  </header>

  <!-- YOUR EXISTING APP CONTENT GOES HERE -->
  <div id="app" class="flex-1 overflow-hidden">
    <!-- Paste your chat UI, login screen, everything here -->
    <!-- I left this space so your existing code won't break -->
  </div>


<script type="module">
  // YOUR EXISTING JAVASCRIPT CODE GOES HERE
  // Firebase, chat logic, everything you already have

  lucide.createIcons();

  // ===== PWA INSTALL CODE - DO NOT TOUCH =====
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').classList.remove('hidden');
  });

  window.installApp = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBtn').classList.add('hidden');
    }
  };
  // ===== END PWA CODE =====

</script>
</body>
</html>
