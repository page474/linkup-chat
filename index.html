<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkUp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0A0E13; color: #fff; height: 100vh; }
    .hidden { display: none !important; }
    
    /* HEADER */
    .header { background: #121A22; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 20px; color: #00BFA6; }
    .header .back { font-size: 24px; cursor: pointer; }
    
    /* SETTINGS */
    .setting-item { display: flex; align-items: center; padding: 14px 20px; background: #121A22; border-bottom: 1px solid #1E2A36; cursor: pointer; }
    .setting-item:active { background: #1E2A36; }
    .icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 15px; }
    .icon svg { width: 22px; height: 22px; fill: #fff; }
    .setting-text { flex: 1; }
    .setting-text .title { font-size: 16px; }
    .setting-text .sub { font-size: 12px; color: #8A9BA8; }
    
    /* TOGGLE */
    .switch { position: relative; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2A3038; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #00BFA6; }
    input:checked + .slider:before { transform: translateX(24px); }
    
    /* PROFILE */
    .profileCard { background: #121A22; padding: 20px; display: flex; align-items: center; border-bottom: 1px solid #1E2A36; }
    .profileCard .avatar { width: 60px; height: 60px; background: #00BFA6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #000; margin-right: 15px; }
    
    /* EMPTY STATE */
    .emptyState { text-align: center; padding: 60px 20px; color: #8A9BA8; }
    .emptyState svg { width: 80px; height: 80px; fill: #2A3038; margin-bottom: 20px; }
    
    /* CHAT */
    #chatScreen { display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 15px; }
    .msg { background: #1E2A36; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; max-width: 75%; width: fit-content; }
    .msg.me { background: #00BFA6; color: #000; margin-left: auto; }
    
    /* NEW PRO INPUT BAR */
    #chatInput { 
      display: flex; 
      padding: 10px 12px; 
      background: #121A22; 
      align-items: center;
      gap: 8px;
      border-top: 1px solid #1E2A36;
    }
    #chatInput .inputBox { 
      flex: 1; 
      display: flex;
      align-items: center;
      background: #0A0E13; 
      border: 1px solid #1E2A36; 
      border-radius: 25px; 
      padding: 4px 4px 4px 16px;
    }
    #chatInput input { 
      flex: 1; 
      background: transparent; 
      border: none; 
      color: #fff; 
      outline: none;
      font-size: 15px;
    }
    #chatInput .sendBtn { 
      width: 44px;
      height: 44px;
      background: #00BFA6; 
      border: none; 
      border-radius: 50%; 
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #chatInput .sendBtn svg { width: 22px; height: 22px; fill: #000; }
    #chatInput .sendBtn:active { transform: scale(0.95); }
    
    /* POPUP */
    .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .popupBox { background: #121A22; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
    .popupBox input { width: 100%; padding: 14px; background: #0A0E13; border: 1px solid #1E2A36; border-radius: 8px; color: #fff; margin: 15px 0; }
    
    .fab { position: fixed; bottom: 80px; right: 20px; width: 56px; height: 56px; background: #00BFA6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #000; border: none; cursor: pointer; }
    
    /* BOTTOM NAV */
    .bottomNav { position: fixed; bottom: 0; width: 100%; background: #121A22; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #1E2A36; }
    .navItem { text-align: center; color: #8A9BA8; font-size: 11px; cursor: pointer; padding: 5px 0; width: 25%; }
    .navItem.active { color: #00BFA6; }
    .navItem svg { width: 24px; height: 24px; fill: #8A9BA8; margin-bottom: 4px; }
    .navItem.active svg { fill: #00BFA6; }
    
    /* COLORS LIKE SCREENSHOT */
    .c1{background:#00C896}.c2{background:#3B82F6}.c3{background:#00BFA6}.c4{background:#EF4444}
    .c5{background:#8B5CF6}.c6{background:#F59E0B}
  </style>
</head>
<body>
  <!-- CHATS SCREEN -->
  <div id="chatsScreen">
    <div class="header"><h1>Chats</h1><div id="myIdTop" style="font-size:12px; color:#8A9BA8;"></div></div>
    <div id="chatList"></div>
    <button class="fab" onclick="showNewChat()">+</button>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen" class="hidden">
    <div class="header"><div class="back" onclick="backToChats()">←</div><h1 id="chatWithId"></h1></div>
    <div id="messages"></div>
    <div id="chatInput">
      <div class="inputBox">
        <input type="text" id="msgInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMsg()">
      </div>
      <button class="sendBtn" onclick="sendMsg()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- SETTINGS SCREEN -->
  <div id="settingsScreen" class="hidden">
    <div class="header"><h1>Settings</h1></div>
    <div class="profileCard">
      <div class="avatar">L</div>
      <div><div style="font-size:18px; font-weight:bold;" id="myId">LNK-813878</div><div style="color:#8A9BA8; font-size:14px;">Your LinkUp ID</div></div>
    </div>
    <div class="setting-item" onclick="showScreen('privacyScreen')"><div class="icon c4"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></div><div class="setting-text"><div class="title">Privacy & Security</div></div></div>
  </div>

  <!-- PRIVACY SCREEN -->
  <div id="privacyScreen" class="hidden">
    <div class="header"><div class="back" onclick="showScreen('settingsScreen')">←</div><h1>Privacy & Security</h1></div>
    <div class="setting-item"><div class="icon c1"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm-1 14h2v-2h-2v2zm0-4h2V7h-2v6z"/></svg></div><div class="setting-text"><div class="title">Last Seen & Online</div><div class="sub">Nobody</div></div></div>
    <div class="setting-item" onclick="showScreen('blockedScreen')"><div class="icon c4"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg></div><div class="setting-text"><div class="title">Blocked Users</div><div class="sub">0 users</div></div></div>
    <div class="setting-item"><div class="icon c5"><svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg></div><div class="setting-text"><div class="title">Read Receipts</div></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
  </div>

  <!-- BLOCKED SCREEN -->
  <div id="blockedScreen" class="hidden">
    <div class="header"><div class="back" onclick="showScreen('privacyScreen')">←</div><h1>Blocked Users</h1></div>
    <div class="emptyState">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm7 10c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V6.3l7-3 7 3V11z"/></svg>
      <h3>No Blocked Users</h3>
      <p>Users you block will appear here</p>
    </div>
  </div>

  <!-- NEW CHAT POPUP -->
  <div id="newChatPopup" class="popup hidden">
    <div class="popupBox">
      <h3>Start New Chat</h3>
      <p style="color:#8A9BA8; font-size:14px;">Enter your friend's LinkUp ID</p>
      <input type="text" id="friendIdInput" placeholder="LNK-123456">
      <button onclick="startChat()" style="width:100%; padding:14px; background:#00BFA6; border:none; border-radius:8px; color:#000; font-weight:bold;">Message</button>
      <button onclick="hideNewChat()" style="width:100%; padding:14px; background:#1E2A36; border:none; border-radius:8px; color:#fff; margin-top:10px;">Cancel</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottomNav">
    <div class="navItem active" onclick="showScreen('chatsScreen')"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Chats</div>
    <div class="navItem" onclick="showScreen('settingsScreen')"><svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>Settings</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
      authDomain: "linkup-chat-3fdd5.firebaseapp.com",
      databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
      projectId: "linkup-chat-3fdd5",
      storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
      messagingSenderId: "177573067619",
      appId: "1:177573067619:web:40e64ae330bb86200e7156"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    let myId = localStorage.getItem('myLinkUpId') || "LNK-" + Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem('myLinkUpId', myId);
    let currentChatId = "";
    
    document.getElementById('myId').innerText = myId;
    document.getElementById('myIdTop').innerText = myId;

    window.showScreen = (id) => {
      document.querySelectorAll('#chatsScreen,#settingsScreen,#privacyScreen,#blockedScreen,#chatScreen').forEach(e=>e.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      document.querySelectorAll('.navItem').forEach(e=>e.classList.remove('active'));
    }
    window.showNewChat = () => document.getElementById('newChatPopup').classList.remove('hidden');
    window.hideNewChat = () => document.getElementById('newChatPopup').classList.add('hidden');

    window.startChat = () => {
      const fid = document.getElementById('friendIdInput').value.toUpperCase();
      if(!fid) return alert("Enter ID");
      currentChatId = [myId, fid].sort().join('_');
      document.getElementById('chatWithId').innerText = fid;
      showScreen('chatScreen');
      hideNewChat();
      loadMessages();
    }

    window.backToChats = () => showScreen('chatsScreen');

    window.sendMsg = () => {
      const text = document.getElementById('msgInput').value;
      if(!text) return;
      const msgRef = push(ref(db, 'chats/' + currentChatId));
      set(msgRef, { sender: myId, text: text, time: Date.now() });
      document.getElementById('msgInput').value = "";
    }

    function loadMessages() {
      onValue(ref(db, 'chats/' + currentChatId), (snapshot) => {
        const messages = snapshot.val();
        const box = document.getElementById('messages');
        box.innerHTML = "";
        if(messages) {
          Object.values(messages).forEach(msg => {
            const div = document.createElement('div');
            div.className = 'msg ' + (msg.sender === myId ? 'me' : '');
            div.innerText = msg.text;
            box.appendChild(div);
          });
          box.scrollTop = box.scrollHeight;
        }
      });
    }
  </script>
</body>
</html>
