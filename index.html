<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkUp - Your Private Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #0f172a; }
  .chat-bg { background-image: url('https://i.imgur.com/4t2Q6fB.png'); background-size: 400px; }
  .bubble-me { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  .bubble-them { background: #1e293b; }
  .glass { backdrop-filter: blur(10px); background: rgba(15, 23, 42, 0.8); }
</style>
</head>
<body class="text-white">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl border-slate-700">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mb-4">
        <span class="text-3xl">💬</span>
      </div>
      <h1 class="text-3xl font-bold">LinkUp</h1>
      <p class="text-slate-400 mt-2">Your private chat. No servers. Just you.</p>
    </div>
    
    <div class="bg-slate-800 rounded-2xl p-4 mb-4">
      <p class="text-sm text-slate-400">Your ID</p>
      <p id="myId" class="text-xl font-bold text-indigo-400">Loading...</p>
      <button onclick="copyId()" class="text-xs text-purple-400 mt-1">Tap to copy</button>
    </div>

    <input id="friendId" type="text" placeholder="Paste friend's LinkUp ID" 
      class="w-full bg-slate-800 border-slate-700 rounded-xl p-3 mb-3 focus:border-indigo-500 outline-none">
    <button onclick="addFriend()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl p-3 font-semibold hover:scale-105 transition">Add Friend</button>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chatScreen" class="hidden h-screen flex-col">
  <div class="glass border-b border-slate-700 p-4 flex items-center gap-3">
    <button onclick="backToHome()" class="text-2xl">←</button>
    <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full"></div>
    <div>
      <p id="chatWith" class="font-semibold">Chat</p>
      <p id="onlineStatus" class="text-xs text-green-400">online</p>
    </div>
  </div>
  <div id="messages" class="flex-1 overflow-y-auto p-4 chat-bg space-y-2"></div>
  <div class="glass border-t border-slate-700 p-3 flex items-center gap-2">
    <input id="msgInput" type="text" placeholder="Type a message..." 
      class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 focus:border-indigo-500 outline-none">
    <button onclick="sendMsg()" class="w-12 h-12 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full flex items-center justify-center">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// YOUR REAL FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
  projectId: "linkup-chat-3fdd5",
  storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
  messagingSenderId: "177573067619",
  appId: "1:177573067619:web:40e64ae330bb86200e7156"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
let myId = '';
let currentChat = '';

signInAnonymously(auth);
onAuthStateChanged(auth, (user) => {
  if (user) {
    myId = 'LinkUp_' + user.uid.slice(0,4).toUpperCase();
    document.getElementById('myId').innerText = myId;
    set(ref(db, 'online/' + myId), true);
  } else {
    document.getElementById('myId').innerText = "Error - Check Anonymous";
  }
});

window.copyId = () => { navigator.clipboard.writeText(myId); alert('ID Copied!'); }
window.addFriend = () => {
  const fid = document.getElementById('friendId').value.trim();
  if(fid) { currentChat = [myId, fid].sort().join('_'); document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('chatScreen').classList.remove('hidden'); document.getElementById('chatWith').innerText = fid; loadMessages(); }
}
window.backToHome = () => { document.getElementById('chatScreen').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }

function loadMessages() {
  const msgRef = ref(db, 'chats/' + currentChat);
  onChildAdded(msgRef, (snap) => {
    const msg = snap.val();
    const div = document.createElement('div');
    div.className = `flex ${msg.sender === myId ? 'justify-end' : 'justify-start'}`;
    div.innerHTML = `<div class="max-w-xs ${msg.sender === myId ? 'bubble-me' : 'bubble-them'} rounded-2xl px-4 py-2">
      <p>${msg.text}</p>
    </div>`;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 99999;
  });
}

window.sendMsg = () => {
  const text = document.getElementById('msgInput').value.trim();
  if(text && currentChat) {
    push(ref(db, 'chats/' + currentChat), { sender: myId, text, time: Date.now() });
    document.getElementById('msgInput').value = '';
  }
}
</script>
</body>
</html>
