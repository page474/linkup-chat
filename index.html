<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LinkUp</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00BFA6">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0A0E13; color: #fff; height: 100vh; overflow: hidden; }
    .hidden { display: none !important; }
    
    #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #00BFA6 0%, #00897B 100%); }
    #splash img { width: 100px; height: 100px; background: #fff; border-radius: 24px; margin-bottom: 20px; }
    #splash h1 { font-size: 32px; margin-bottom: 8px; }
    .loader { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-top: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #welcome { padding: 40px 20px; max-width: 400px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; justify-content: center; text-align: center; }
    #welcome h2 { color: #00BFA6; font-size: 28px; margin-bottom: 10px; }
    #myId { background: #1A1F25; padding: 20px; border-radius: 12px; font-size: 24px; font-weight: bold; color: #00BFA6; letter-spacing: 2px; margin: 20px 0; }
    #welcome button { width: 100%; padding: 16px; background: #00BFA6; border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
    
    #home { padding: 20px; height: 100vh; }
    #home h2 { color: #00BFA6; margin-bottom: 20px; }
    #home input { width: 100%; padding: 14px; background: #1A1F25; border: 1px solid #2A3038; border-radius: 8px; color: #fff; font-size: 16px; margin-bottom: 10px; }
    .chat-btn { background: #1A1F25; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid #2A3038; }
    
    #chat { display: flex; flex-direction: column; height: 100vh; }
    #chatHeader { padding: 15px; background: #1A1F25; border-bottom: 1px solid #2A3038; display: flex; justify-content: space-between; align-items: center; }
    #chatHeader button { background: #2A3038; border: none; padding: 8px 14px; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 15px; background: #0A0E13; }
    .msg { background: #1A1F25; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; max-width: 75%; word-wrap: break-word; }
    .msg.me { background: #00BFA6; margin-left: auto; color: #000; }
    #chatInput { display: flex; padding: 10px; background: #1A1F25; border-top: 1px solid #2A3038; }
    #chatInput input { flex: 1; padding: 12px 16px; background: #0A0E13; border: 1px solid #2A3038; border-radius: 20px; color: #fff; font-size: 15px; outline: none; }
    #chatInput button { margin-left: 10px; padding: 12px 20px; background: #00BFA6; border: none; border-radius: 20px; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2300BFA6'/%3E%3Cpath d='M30 50 L45 65 L70 35' stroke='%23000' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <h1>LinkUp</h1>
    <div class="loader"></div>
  </div>

  <div id="welcome" class="hidden">
    <h2>Welcome to LinkUp</h2>
    <p>Your LinkUp ID</p>
    <div id="myId">LNK-000</div>
    <button onclick="goHome()">Start Chatting</button>
  </div>

  <div id="home" class="hidden">
    <h2>Start New Chat</h2>
    <input type="text" id="friendId" placeholder="Enter Friend's ID: LNK-123456">
    <button onclick="startPrivateChat()" style="width:100%; padding:14px; background:#00BFA6; border:none; border-radius:8px; color:#000; font-weight:bold;">Message</button>
    <h3 style="margin-top:30px; color:#aaa;">My ID: <span id="myIdHome"></span></h3>
    <button onclick="logout()" style="margin-top:20px; width:100%; padding:14px; background:#ff4444; border:none; border-radius:8px; color:#fff; font-weight:bold;">Reset ID</button>
  </div>

  <div id="chat" class="hidden">
    <div id="chatHeader">
      <button onclick="goHome()">← Back</button>
      <h3 id="chatWith">Chatting...</h3>
    </div>
    <div id="messages"></div>
    <div id="chatInput">
      <input type="text" id="msgInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, push, onValue, serverTimestamp, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
      authDomain: "linkup-chat-3fdd5.firebaseapp.com",
      databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
      projectId: "linkup-chat-3fdd5",
      storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
      messagingSenderId: "177573067619",
      appId: "1:177573067619:web:40e64ae330bb86200e7156",
      measurementId: "G-Q73V61VYEQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let myLinkUpId = "";
    let chatId = ""; // room id for 2 people

    function generateId() {
      const num = Math.floor(100000 + Math.random() * 900000);
      return `LNK-${num}`;
    }

    // Create chat room ID from 2 IDs so both phones see same room
    function getChatId(id1, id2) {
      return [id1, id2].sort().join('_');
    }

    signInAnonymously(auth);

    onAuthStateChanged(auth, (user) => {
      setTimeout(() => {
        document.getElementById('splash').classList.add('hidden');
        if (user) {
          currentUser = user;
          const userRef = ref(db, 'users/' + user.uid);
          onValue(userRef, (snap) => {
            if(snap.exists()) {
              myLinkUpId = snap.val().linkupId;
            } else {
              myLinkUpId = generateId();
              set(userRef, { linkupId: myLinkUpId });
            }
            document.getElementById('myId').innerText = myLinkUpId;
            document.getElementById('myIdHome').innerText = myLinkUpId;
            document.getElementById('welcome').classList.remove('hidden');
          }, { onlyOnce: true });
        }
      }, 1500);
    });

    window.goHome = () => {
      document.getElementById('welcome').classList.add('hidden');
      document.getElementById('chat').classList.add('hidden');
      document.getElementById('home').classList.remove('hidden');
    }

    window.startPrivateChat = () => {
      const friendId = document.getElementById('friendId').value.trim().toUpperCase();
      if(!friendId.startsWith('LNK-')) return alert("Enter correct ID like LNK-123456");
      if(friendId === myLinkUpId) return alert("That is your own ID 😂");
      
      chatId = getChatId(myLinkUpId, friendId);
      document.getElementById('chatWith').innerText = friendId;
      document.getElementById('home').classList.add('hidden');
      document.getElementById('chat').classList.remove('hidden');
      loadMessages();
    }

    window.logout = () => {
      if(confirm("Reset go give you new ID. Continue?")) signOut(auth).then(() => window.location.reload());
    }

    window.sendMsg = async () => {
      const input = document.getElementById('msgInput');
      if(input.value.trim() === '' || !chatId) return;
      push(ref(db, "chats/" + chatId + "/messages"), {
        text: input.value,
        from: myLinkUpId,
        timestamp: serverTimestamp()
      });
      input.value = '';
    }

    function loadMessages() {
      const messagesRef = ref(db, "chats/" + chatId + "/messages");
      onValue(messagesRef, (snapshot) => {
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML = '';
        snapshot.forEach(child => {
          const msg = child.val();
          const isMe = msg.from === myLinkUpId;
          messagesDiv.innerHTML += `<div class="msg ${isMe ? 'me' : ''}">${msg.text}</div>`;
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }
  </script>
</body>
</html>
