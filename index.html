<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkUp</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00BFA6">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0A0E13; color: #fff; height: 100vh; overflow: hidden; }
    #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #00BFA6 0%, #00897B 100%); }
    #splash img { width: 100px; height: 100px; background: #fff; border-radius: 24px; margin-bottom: 20px; }
    #splash h1 { font-size: 32px; margin-bottom: 8px; }
    #splash p { opacity: 0.8; }
    .loader { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-top: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #app { display: none; height: 100vh; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2300BFA6'/%3E%3C/svg%3E">
    <h1>LinkUp</h1>
    <p>Stay connected</p>
    <div class="loader"></div>
  </div>

  <div id="app">
    <h2>LinkUp is Loading...</h2>
    <p>If you see this, Firebase don connect ✅</p>
  </div>

  <script type="module">
    // IMPORT FIREBASE
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // YOUR FIREBASE CONFIG - I put your own here
    const firebaseConfig = {
      apiKey: "AIzaSyBxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
      authDomain: "linkup-xxxxx.firebaseapp.com",
      projectId: "linkup-xxxxx",
      storageBucket: "linkup-xxxxx.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:xxxxxxxxxxxxxxxx"
    };

    // INIT FIREBASE
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    console.log("Firebase Connected ✅");

    // CHECK IF USER LOGIN
    onAuthStateChanged(auth, (user) => {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      
      if (user) {
        console.log("User logged in:", user.uid);
      } else {
        console.log("No user, show login screen");
      }
    });

    // TIMEOUT AFTER 5 SECONDS IF FIREBASE FAIL
    setTimeout(() => {
      if(document.getElementById('splash').style.display !== 'none') {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('app').innerHTML = '<h2>Error: Check Firebase Config</h2><p>Open console to see error</p>';
        document.getElementById('app').style.display = 'block';
      }
    }, 5000);

  </script>
</body>
</html>
