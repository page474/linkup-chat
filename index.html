<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkUp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0A0E13; color: #fff; height: 100vh; }
    .hidden { display: none !important; }
    
    /* HEADER */
    .header { background: #121A22; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 22px; color: #00BFA6; }
    .header .icons { display: flex; gap: 20px; font-size: 22px; }
    
    /* MY ID CARD */
    .myIdCard { margin: 15px; background: #121A22; border-radius: 12px; padding: 15px; display: flex; align-items: center; border-left: 3px solid #00BFA6; }
    .avatar { width: 50px; height: 50px; background: #00BFA6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; margin-right: 12px; }
    .idInfo { flex: 1; }
    .idInfo .label { font-size: 12px; color: #8A9BA8; }
    .idInfo .id { font-size: 18px; font-weight: bold; }
    
    /* CONNECT CARD */
    .connectCard { margin: 15px; background: #121A22; border-radius: 12px; padding: 20px; }
    .connectCard h3 { color: #00BFA6; text-align: center; margin-bottom: 15px; }
    .connectCard p { color: #8A9BA8; font-size: 14px; line-height: 1.5; margin-bottom: 15px; }
    .idBox { background: #0A0E13; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .idBox .num { font-size: 16px; letter-spacing: 1px; }
    .copyBtn { background: #00BFA6; border: none; padding: 8px 12px; border-radius: 6px; color: #000; font-weight: bold; }
    .addFriend { width: 100%; padding: 14px; background: #00BFA6; border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 16px; }
    
    /* BOTTOM NAV */
    .bottomNav { position: fixed; bottom: 0; width: 100%; background: #121A22; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #1E2A36; }
    .navItem { text-align: center; color: #8A9BA8; font-size: 12px; }
    .navItem.active { color: #00BFA6; }
    .navItem .icon { font-size: 24px; margin-bottom: 4px; }
    
    /* FAB BUTTON */
    .fab { position: fixed; bottom: 80px; right: 20px; width: 56px; height: 56px; background: #00BFA6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #000; border: none; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div class="header">
    <h1>Chats</h1>
    <div class="icons">🔍 ⋮</div>
  </div>

  <!-- MY ID AT TOP -->
  <div class="myIdCard">
    <div class="avatar" id="avatar">L</div>
    <div class="idInfo">
      <div class="label" id="myIdLabel">LNK-813878 (You)</div>
      <div class="label">Tap to share your ID</div>
    </div>
  </div>

  <!-- CONNECT CARD -->
  <div class="connectCard">
    <h3>Start New Chat</h3>
    <p>Share your <span style="color:#00BFA6">LinkUp ID</span> with friends so they can contact you privately.</p>
    <div class="idBox">
      <div class="num" id="myIdDisplay">LNK-813878</div>
      <button class="copyBtn" onclick="copyId()">Copy</button>
    </div>
    <p>Or connect with someone using their ID below</p>
    <input type="text" id="friendId" placeholder="Enter Friend's ID" style="width:100%; padding:12px; background:#0A0E13; border:1px solid #1E2A36; border-radius:8px; color:#fff; margin-bottom:10px;">
    <button class="addFriend" onclick="startChat()">Message</button>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="alert('New Chat')">+</button>

  <!-- BOTTOM NAV -->
  <div class="bottomNav">
    <div class="navItem active"><div class="icon">💬</div>Chats</div>
    <div class="navItem"><div class="icon">📞</div>Calls</div>
    <div class="navItem"><div class="icon">👥</div>Contacts</div>
    <div class="navItem"><div class="icon">⚙️</div>Settings</div>
  </div>

  <script>
    // This will connect to your Firebase later
    let myId = "LNK-" + Math.floor(100000 + Math.random() * 900000);
    document.getElementById('myIdDisplay').innerText = myId;
    document.getElementById('myIdLabel').innerText = myId + " (You)";
    document.getElementById('avatar').innerText = "L";

    function copyId() {
      navigator.clipboard.writeText(myId);
      alert("ID Copied: " + myId);
    }
    function startChat() {
      const fid = document.getElementById('friendId').value;
      if(fid) alert("Starting chat with " + fid);
    }
  </script>
</body>
</html>
