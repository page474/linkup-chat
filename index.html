<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LinkUp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
body{background:#0A0E13;color:#fff;height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}
.header{background:#121A22;padding:15px 20px;display:flex;align-items:center;border-bottom:1px solid #1E2A36}
.header h1{flex:1;color:#00BFA6;font-size:20px}
.back{font-size:24px;cursor:pointer;margin-right:15px}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* AUTH */
.authBox{margin:auto;text-align:center;padding:40px 20px;width:100%;max-width:400px}
.authBox input{width:100%;padding:14px;background:#121A22;border:1px solid #263442;border-radius:8px;color:#fff;margin-bottom:15px}
.authBtn{width:100%;padding:14px;background:#00BFA6;border:none;border-radius:8px;color:#000;font-weight:bold}

/* CHAT LIST */
#chatList{flex:1}
.chatItem{display:flex;align-items:center;padding:15px;border-bottom:1px solid #1E2A36;cursor:pointer;position:relative}
.chatItem:active{background:#121A22}
.avatar{width:50px;height:50px;border-radius:50%;background:#00BFA6;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;margin-right:12px;position:relative;font-size:18px}
.chatInfo{flex:1;min-width:0}
.chatName{font-weight:bold;margin-bottom:4px}
.lastMsg{color:#8A9BA8;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatOptions{font-size:20px;padding:10px}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#00BFA6;border:none;font-size:28px;color:#000}
.empty{text-align:center;color:#71808d;padding:60px 20px}

/* CHAT */
#messages{flex:1;padding:15px;overflow-y:auto}
.msg{background:#1E2A36;padding:10px 14px;border-radius:12px;margin-bottom:8px;max-width:75%;width:fit-content}
.msg.me{background:#00BFA6;color:#000;margin-left:auto}
.msgBottom{font-size:10px;color:#8FA0AA;text-align:right;margin-top:3px}
.me .msgBottom{color:#00110d}
.blockedBanner{background:#5e2a2a;color:#ff8080;padding:10px;text-align:center;font-size:14px}
.inputArea{display:flex;padding:10px;background:#121A22;border-top:1px solid #1E2A36;gap:8px}
.inputArea input{flex:1;background:#0A0E13;border:1px solid #263442;border-radius:25px;padding:12px 16px;color:#fff;outline:none}
.inputArea button{width:44px;height:44px;border-radius:50%;background:#00BFA6;border:none;color:#000;font-size:20px}
.inputArea.disabled input{background:#1a1f25;cursor:not-allowed}

/* POPUP & MENU */
.popup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.popupBox{background:#121A22;padding:20px;border-radius:12px;width:90%;max-width:400px}
.popupBtn{width:100%;padding:14px;background:#00BFA6;border:none;border-radius:8px;color:#000;font-weight:bold;margin-top:10px}
.danger{background:#d32f2f!important;color:#fff!important}
.menu{position:absolute;right:10px;top:50px;background:#1E2A36;border-radius:8px;z-index:50;box-shadow:0 4px 15px #000}
.menuItem{padding:12px 20px;cursor:pointer}
.menuItem:hover{background:#263442}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen" class="screen">
  <div class="authBox">
    <h1 style="color:#00BFA6;font-size:32px;margin-bottom:10px">LinkUp</h1>
    <input id="authIdInput" type="text" placeholder="LNK-123456 or leave blank">
    <button class="authBtn" onclick="joinApp()">Join LinkUp</button>
  </div>
</div>

<!-- CHATS SCREEN -->
<div id="chatsScreen" class="screen hidden">
  <div class="header"><h1>LinkUp</h1><div id="myId" style="font-size:12px;color:#8A9BA8"></div></div>
  <div id="chatList"></div>
  <button class="fab" onclick="showNewChat()">+</button>
</div>

<!-- CHAT SCREEN -->
<div id="chatScreen" class="screen hidden">
  <div class="header">
    <div class="back" onclick="backToChats()">←</div>
    <h1 id="chatWithId"></h1>
    <div class="chatOptions" onclick="showChatMenu()">⋮</div>
  </div>
  <div id="blockedBanner" class="blockedBanner hidden">You blocked this user</div>
  <div id="messages"></div>
  <div id="inputArea" class="inputArea">
    <input id="msgInput" type="text" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- NEW CHAT POPUP -->
<div id="newChatPopup" class="popup hidden">
  <div class="popupBox">
    <h2>New Chat</h2>
    <input id="friendIdInput" type="text" placeholder="LNK-123456">
    <button class="popupBtn" onclick="startChat()">Start Chat</button>
    <button class="popupBtn" style="background:#1E2A36;color:#fff" onclick="hideNewChat()">Cancel</button>
  </div>
</div>

<!-- CHAT MENU -->
<div id="chatMenu" class="popup hidden" onclick="hideChatMenu()">
  <div class="popupBox" onclick="event.stopPropagation()">
    <h3>Chat Options</h3>
    <button class="popupBtn danger" onclick="blockUser()">Block User</button>
    <button class="popupBtn danger" onclick="deleteChat()">Delete Chat</button>
    <button class="popupBtn" style="background:#1E2A36;color:#fff" onclick="hideChatMenu()">Cancel</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = { databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com", projectId: "linkup-chat-3fdd5" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myId = "";
let currentChat = "";
let currentFriend = "";

if(localStorage.getItem('linkupId')){
  myId = localStorage.getItem('linkupId');
  showApp();
}

window.joinApp = () => {
  const inputId = document.getElementById('authIdInput').value.toUpperCase();
  myId = inputId && inputId.startsWith("LNK-") ? inputId : "LNK-" + Math.floor(100000 + Math.random() * 900000);
  localStorage.setItem('linkupId', myId);
  showApp();
}

function showApp(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('chatsScreen').classList.remove('hidden');
  document.getElementById('myId').innerText = myId;
  set(ref(db, 'users/' + myId), { online: true });
  loadChats();
}

window.showNewChat = () => document.getElementById('newChatPopup').classList.remove('hidden');
window.hideNewChat = () => document.getElementById('newChatPopup').classList.add('hidden');
window.showChatMenu = () => document.getElementById('chatMenu').classList.remove('hidden');
window.hideChatMenu = () => document.getElementById('chatMenu').classList.add('hidden');

window.startChat = () => {
  const fid = document.getElementById('friendIdInput').value.toUpperCase();
  if(!fid || fid === myId) return alert("Enter valid ID");
  currentFriend = fid;
  currentChat = [myId, fid].sort().join('_');
  document.getElementById('chatWithId').innerText = fid;
  document.getElementById('chatsScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  hideNewChat();
  checkBlocked();
  loadMessages();
  update(ref(db, 'chatList/' + myId + '/' + fid), { lastTime: Date.now() });
  update(ref(db, 'chatList/' + fid + '/' + myId), { lastTime: Date.now() });
}

window.backToChats = () => {
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('chatsScreen').classList.remove('hidden');
  loadChats();
}

window.sendMsg = () => {
  const text = document.getElementById('msgInput').value;
  if(!text) return;
  push(ref(db, 'chats/' + currentChat), { sender: myId, text, time: Date.now() });
  document.getElementById('msgInput').value = "";
}

function checkBlocked(){
  onValue(ref(db, 'blocked/' + myId + '/' + currentFriend), snap => {
    const blocked = snap.val();
    document.getElementById('blockedBanner').classList.toggle('hidden', !blocked);
    document.getElementById('inputArea').classList.toggle('disabled', blocked);
    document.getElementById('msgInput').disabled = blocked;
  });
}

window.blockUser = () => {
  if(confirm("Block " + currentFriend + "?")){
    set(ref(db, 'blocked/' + myId + '/' + currentFriend), true);
    hideChatMenu();
    alert(currentFriend + " blocked");
  }
}

window.deleteChat = () => {
  if(confirm("Delete this chat for you?")){
    remove(ref(db, 'chatList/' + myId + '/' + currentFriend));
    remove(ref(db, 'chats/' + currentChat));
    hideChatMenu();
    backToChats();
  }
}

function loadMessages() {
  onValue(ref(db, 'chats/' + currentChat), snap => {
    const msgs = snap.val();
    const box = document.getElementById('messages');
    box.innerHTML = "";
    if(msgs) Object.values(msgs).forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.sender === myId ? 'me' : '');
      div.innerHTML = `${m.text}<div class="msgBottom">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
}

function loadChats() {
  onValue(ref(db, 'chatList/' + myId), snap => {
    const chats = snap.val();
    const list = document.getElementById('chatList');
    list.innerHTML = "";
    if(!chats) {
      list.innerHTML = `<div class="empty">💬<br>No chats yet<br>Tap + to start</div>`;
      return;
    }
    Object.keys(chats).forEach(fid => {
      onValue(ref(db, 'blocked/' + myId + '/' + fid), blockSnap => {
        if(blockSnap.val()) return; // hide blocked chats
        const chatId = [myId, fid].sort().join('_');
        onValue(ref(db, 'chats/' + chatId), msgSnap => {
          const msgs = msgSnap.val();
          const lastMsg = msgs ? Object.values(msgs).pop() : {text:"No messages yet"};
          const div = document.createElement('div');
          div.className = 'chatItem';
          div.onclick = () => { document.getElementById('friendIdInput').value = fid; startChat(); }
          div.innerHTML = `
            <div class="avatar">${fid[4]}</div>
            <div class="chatInfo">
              <div class="chatName">${fid}</div>
              <div class="lastMsg">${lastMsg.text}</div>
            </div>
          `;
          list.appendChild(div);
        }, {onlyOnce: true});
      });
    });
  });
}
</script>
</body>
</html>
