<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkUp</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: #111b21; color: white; font-family: Arial; }
.me { background: #005c4b; }
.them { background: #202c33; }
.chat-img { max-width: 260px; border-radius: 8px; }
</style>
</head>
<body>

<div id="home" class="h-screen flex flex-col">
  <div class="bg-[#202c33] p-4">
    <h1 class="text-2xl font-bold">LinkUp</h1>
    <div class="bg-[#2a3942] p-3 rounded-xl mt-2">
      <p class="text-xs text-gray-400">Your ID</p>
      <p id="myId" class="text-[#00a884] font-bold">Loading...</p>
    </div>
  </div>
  <div class="p-3">
    <div class="flex gap-2">
      <input id="newId" placeholder="Enter friend's LinkUp ID" class="flex-1 bg-[#202c33] rounded-full px-4 py-3">
      <button onclick="startNew()" class="bg-[#00a884] w-12 h-12 rounded-full">+</button>
    </div>
  </div>
  <div id="chatList" class="flex-1 overflow-y-auto"></div>
</div>

<div id="chat" class="hidden h-screen flex-col">
  <div class="bg-[#202c33] p-3 flex items-center gap-3">
    <button onclick="back()" class="text-2xl">←</button>
    <p id="chatWith" class="font-bold"></p>
  </div>
  <div id="msgs" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
  <div class="bg-[#202c33] p-2 flex gap-2">
    <input type="file" id="file" accept="image/*" class="hidden" onchange="sendImg(event)">
    <button onclick="document.getElementById('file').click()" class="text-2xl">📎</button>
    <input id="msg" placeholder="Message" class="flex-1 bg-[#2a3942] rounded-full px-4 py-3">
    <button onclick="send()" class="bg-[#00a884] w-11 h-11 rounded-full">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
  projectId: "linkup-chat-3fdd5",
  appId: "1:177573067619:web:40e64ae330bb86200e7156"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
let myId = '';
let chatId = '';

signInAnonymously(auth);
onAuthStateChanged(auth, u => {
  if(u){
    myId = 'LinkUp_' + u.uid.slice(0,8).toUpperCase();
    document.getElementById('myId').innerText = myId;
    loadChats();
  }
});

function loadChats(){
  onValue(ref(db, 'users/' + myId + '/chats'), snap => {
    document.getElementById('chatList').innerHTML = '';
    snap.forEach(child => {
      const d = child.val();
      const div = document.createElement('div');
      div.className = 'p-3 flex gap-3 hover:bg-[#202c33] cursor-pointer';
      div.onclick = () => open(d.id, d.name);
      div.innerHTML = `<div class="w-12 h-12 bg-purple-600 rounded-full flex items-center justify-center">${d.name[0]}</div><div><p class="font-bold">${d.name}</p><p class="text-sm text-gray-400">${d.lastMsg || ''}</p></div>`;
      document.getElementById('chatList').appendChild(div);
    });
  });
}

window.startNew = () => {
  const fid = document.getElementById('newId').value.trim();
  if(fid) open(fid, fid);
}

function open(fid, name){
  chatId = [myId, fid].sort().join('_');
  document.getElementById('home').classList.add('hidden');
  document.getElementById('chat').classList.remove('hidden');
  document.getElementById('chatWith').innerText = name;
  set(ref(db, 'users/' + myId + '/chats/' + fid), {id: fid, name: name});
  
  onChildAdded(ref(db, 'chats/'+chatId), s => {
    const m = s.val();
    const d = document.createElement('div');
    d.className = m.sender === myId? 'text-right' : 'text-left';
    let content = m.type === 'image'? `<img src="${m.url}" class="chat-img"/>` : `<div class="inline-block ${m.sender === myId? 'me' : 'them'} px-3 py-2 rounded-lg">${m.text}</div>`;
    d.innerHTML = content;
    document.getElementById('msgs').appendChild(d);
    document.getElementById('msgs').scrollTop = 99999;
    set(ref(db, 'users/' + myId + '/chats/' + fid + '/lastMsg'), m.type === 'image'? '📷 Photo' : m.text);
  });
}

window.back = () => {
  document.getElementById('chat').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}

window.send = () => {
  const t = document.getElementById('msg').value;
  if(t){ push(ref(db, 'chats/'+chatId), {sender:myId, text:t, type:'text'}); document.getElementById('msg').value = '';}
}

// SEND IMAGE WITH BASE64 - NO STORAGE NEEDED
window.sendImg = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(event){
    push(ref(db, 'chats/'+chatId), {sender: myId, type: 'image', url: event.target.result});
  }
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
