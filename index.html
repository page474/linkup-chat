<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LinkUp</title>
<style>
body{background:#0A0E13;color:#fff;font-family:Arial;text-align:center;padding-top:100px}
input,button{padding:14px;width:80%;max-width:300px;margin:10px;border-radius:8px;border:1px solid #263442;background:#121A22;color:#fff}
button{background:#00BFA6;color:#000;font-weight:bold;border:none}
.hidden{display:none}
#chats{padding:20px}
</style>
</head>
<body>
<div id="auth">
  <h1 style="color:#00BFA6">LinkUp</h1>
  <input id="authId" placeholder="LNK-123456 or leave blank">
  <button onclick="join()">Join LinkUp</button>
</div>

<div id="chats" class="hidden">
  <h2>Chats</h2>
  <input id="friend" placeholder="Friend LNK-ID">
  <button onclick="send()">Send Test Message</button>
  <div id="log"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com"});
const db = getDatabase(app);
let myId = "";

window.join = () => {
  myId = document.getElementById('authId').value || "LNK-" + Math.floor(100000 + Math.random() * 900000);
  localStorage.setItem('linkupId', myId);
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('chats').classList.remove('hidden');
  document.getElementById('log').innerHTML = "You are: " + myId;
}

window.send = () => {
  const fid = document.getElementById('friend').value;
  const chatId = [myId, fid].sort().join('_');
  push(ref(db, 'chats/' + chatId), {sender: myId, text: "Test", time: Date.now()});
  alert("Message sent to " + fid);
}
</script>
</body>
</html>
