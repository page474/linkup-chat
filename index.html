<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkUp</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00a884">

<style>
* { box-sizing: border-box; }
body { margin: 0; background: #111b21; color: white; font-family: Arial, sans-serif; }
#loadingScreen { position: fixed; inset: 0; z-index: 99999; background: #111b21; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity.5s ease, visibility.5s ease; }
#loadingScreen.hide { opacity: 0; visibility: hidden; }
.loading-logo { width: 95px; height: 95px; border-radius: 28px; background: linear-gradient(135deg, #00a884, #008f72); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(0,168,132,.25); animation: logoPulse 1.6s infinite ease-in-out; }
.loading-logo svg { width: 55px; height: 55px; stroke-width: 2; color: white; }
.loading-title { font-size: 32px; font-weight: bold; margin-top: 22px; }
.loading-subtitle { color: #8696a0; margin-top: 7px; font-size: 14px; }
.loading-spinner { width: 30px; height: 30px; margin-top: 35px; border: 3px solid #2a3942; border-top-color: #00a884; border-radius: 50%; animation: spin.8s linear infinite; }
.loading-status { color: #8696a0; font-size: 12px; margin-top: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes logoPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.app { height: 100dvh; max-width: 900px; margin: auto; padding-bottom: 70px; } /* ADD PADDING FOR NAV */
.topbar { background: #202c33; }
.me { background: #005c4b; }
.them { background: #202c33; }
.chat-img { max-width: 260px; border-radius: 8px; }
.avatar { background: linear-gradient(135deg,#7c3aed,#2563eb); }
.recording { animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.1); } }
.chat-area { background-color: #0b141a; background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px); background-size: 20px 20px; }
.empty-state { text-align: center; color: #8696a0; margin-top: 40%; }
.msg-wrap { position: relative; }
.msg-menu { position: absolute; right: 10px; top: -35px; background: #233138; padding: 8px 12px; border-radius: 8px; display: none; z-index: 10; cursor: pointer; }
.deleted { color: #8696a0; font-style: italic; }

/* FIXED BOTTOM NAV LIKE WHATSAPP */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 900px;
  background: #202c33;
  border-top: 1px solid #344047;
  z-index: 100;
}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="loading-logo"><i data-lucide="message-circle"></i></div>
  <div class="loading-title">LinkUp</div>
  <div class="loading-subtitle">Stay connected</div>
  <div class="loading-spinner"></div>
  <div id="loadingStatus" class="loading-status">Starting LinkUp...</div>
</div>

<div class="app">

<!-- HOME SCREEN -->
<section id="homeScreen" class="h-full flex-col">
  <header class="topbar p-4 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">LinkUp</h1>
      <p id="myIdSmall" class="text-xs text-gray-400"></p>
    </div>
    <div class="flex gap-2">
      <button onclick="installApp()" id="installBtn" class="hidden bg-[#00a884] px-3 py-1 rounded-full text-sm font-bold">Install</button>
      <button onclick="openProfile()"><i data-lucide="settings" class="w-6 h-6"></i></button>
    </div>
  </header>
  <div class="p-3">
    <div class="flex gap-2">
      <input id="newId" placeholder="Enter friend's LinkUp ID" class="flex-1 bg-[#202c33] rounded-full px-4 py-3">
      <button onclick="startNew()" class="bg-[#00a884] w-12 h-12 rounded-full flex items-center justify-center"><i data-lucide="plus" class="w-6 h-6"></i></button>
    </div>
  </div>
  <div id="chatList" class="flex-1 overflow-y-auto"></div>
</section>

<!-- OTHER SCREENS SAME AS BEFORE -->
<section id="chatScreen" class="hidden h-full flex-col">...</section>
<section id="profileScreen" class="hidden h-full flex-col">...</section>
<section id="statusScreen" class="hidden h-full flex-col">...</section>
<section id="callsScreen" class="hidden h-full flex-col">
  <header class="topbar p-4"><h2 class="text-xl font-bold">Calls</h2></header>
  <div class="p-4 text-center text-gray-400 mt-10">Call feature coming soon 🚀</div>
</section>

</div>

<!-- BOTTOM NAV - 4 BUTTONS LIKE WHATSAPP -->
<nav class="bottom-nav grid grid-cols-4 py-2 text-center">
  <button onclick="showHome()" id="navChats" class="flex flex-col items-center text-[#00a884]">
    <i data-lucide="message-circle" class="w-6 h-6"></i><span class="text-xs mt-1">Chats</span>
  </button>
  <button onclick="showStatus()" id="navStatus" class="flex flex-col items-center text-gray-400">
    <i data-lucide="circle" class="w-6 h-6"></i><span class="text-xs mt-1">Updates</span>
  </button>
  <button onclick="showCommunities()" id="navComm" class="flex flex-col items-center text-gray-400">
    <i data-lucide="users" class="w-6 h-6"></i><span class="text-xs mt-1">Groups</span>
  </button>
  <button onclick="showCalls()" id="navCalls" class="flex flex-col items-center text-gray-400">
    <i data-lucide="phone" class="w-6 h-6"></i><span class="text-xs mt-1">Calls</span>
  </button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push, onChildAdded, onChildChanged, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
  projectId: "linkup-chat-3fdd5",
  appId: "1:177573067619:web:40e64ae330bb86200e7156"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
let myId = "";
let currentChat = "";

lucide.createIcons();

function loadingText(text) { document.getElementById("loadingStatus").innerText = text; }
function hideLoading() { document.getElementById("loadingScreen").classList.add("hide"); setTimeout(() => { document.getElementById("loadingScreen").style.display = "none"; }, 600); }
setTimeout(() => { hideLoading(); }, 8000);

signInAnonymously(auth);
onAuthStateChanged(auth, async user => {
  if (!user) return;
  myId = "LinkUp_" + user.uid.substring(0, 8).toUpperCase();
  document.getElementById("myIdSmall").innerText = myId;
  document.getElementById("profileId").innerText = myId;
  await createUser();
  loadChats();
  loadProfile();
  loadStatuses();
  setTimeout(() => { hideLoading(); }, 500);
});

async function createUser(){ const snap = await get(ref(db, "users/"+myId)); if(!snap.exists()){ await set(ref(db, "users/"+myId), {id: myId, name: myId, about: "Available on LinkUp"}); } }

function show(s) { 
  ["homeScreen","chatScreen","profileScreen","statusScreen","callsScreen"].forEach(id=>document.getElementById(id).classList.add("hidden")); 
  document.getElementById(s).classList.remove("hidden"); 
  document.getElementById(s).classList.add("flex");
  lucide.createIcons();
  document.querySelectorAll(".bottom-nav button").forEach(b=>{b.classList.add("text-gray-400"); b.classList.remove("text-[#00a884]")});
  if(s==="homeScreen") document.getElementById("navChats").classList.add("text-[#00a884]");
  if(s==="statusScreen") document.getElementById("navStatus").classList.add("text-[#00a884]");
  if(s==="callsScreen") document.getElementById("navCalls").classList.add("text-[#00a884]");
}

window.showHome = ()=>show("homeScreen");
window.showStatus = ()=>show("statusScreen");
window.showCalls = ()=>show("callsScreen");
window.showCommunities = ()=>alert("Groups coming soon!");
window.openProfile = ()=>show("profileScreen");
window.backHome = ()=>show("homeScreen");

// ... REST OF YOUR JS CODE SAME AS BEFORE ...
// PASTE ALL THE loadProfile, saveProfile, loadChats, openChat, send, etc HERE

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installBtn').classList.remove('hidden'); });
window.installApp = async () => { if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; document.getElementById('installBtn').classList.add('hidden'); } };

</script>
</body>
</html>
