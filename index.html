<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkUp</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
body { background: #0a1628; color: #fff; }
.container { max-width: 600px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
.login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; gap: 15px; text-align: center; }
.login h1 { color: #00d4ff; font-size: 40px; }
.id-box { background: #1e3a5f; padding: 20px; border-radius: 12px; width: 100%; }
.id-box h2 { color: #00d4ff; font-size: 28px; margin: 10px 0; word-break: break-all; }
.copy-btn { background: #1e3a5f; border: 1px solid #00d4ff; color: #00d4ff; padding: 8px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; }
.btn { background: #00d4ff; color: #0a1628; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
.btn.small { width: 25%; padding: 10px; }
.btn.send { width: 80px; }
.btn:active { transform: scale(0.95); }
.header { background: #0f2742; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
.header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
.chat-list, .chat-screen { display: none; flex: 1; flex-direction: column; }
.add-row { display: flex; padding: 10px; gap: 8px; }
.add-row input { flex: 1; padding: 10px; background: #1e3a5f; border: none; color: white; border-radius: 10px; outline: none; }
.messages { flex: 1; overflow-y: auto; padding: 15px; background: #0a1628; }
.msg { background: #1e3a5f; padding: 10px 14px; margin: 8px 0; border-radius: 12px; max-width: 75%; word-wrap: break-word; }
.msg.me { background: #00d4ff; color: #0a1628; margin-left: auto; }
.input-area { display: flex; padding: 10px; background: #0f2742; gap: 8px; align-items: center; }
.input-area input { flex: 1; padding: 12px; border: none; border-radius: 20px; background: #1e3a5f; color: white; outline: none; }
.mic-btn { background: #00d4ff; border: none; width: 45px; height: 45px; border-radius: 50%; color: #0a1628; font-size: 20px; }
.mic-btn.recording { background: red; }
.call-btn { background: none; border: none; color: #00d4ff; font-size: 22px; }
audio { width: 200px; max-width: 100%; }
</style>
</head>
<body>
<div class="container">
  <div class="login" id="login">
    <h1>LinkUp</h1>
    <p>Fast. Secure. No number needed</p>
    <div class="id-box">
      <p>Your LinkUp ID</p>
      <h2 id="myId">Generating...</h2>
      <button onclick="copyId()" class="copy-btn">Copy ID</button>
    </div>
    <button class="btn" onclick="startApp()">Start Chatting</button>
  </div>

  <div class="chat-list" id="chatList">
    <div class="header">
      <h2 id="myHeaderId">Chats</h2>
    </div>
    <div class="add-row">
      <input type="text" id="newChatId" placeholder="Friend ID e.g LinkUp_1234">
      <button class="btn small" onclick="newChat()">Add</button>
    </div>
    <div id="chats"></div>
  </div>

  <div class="chat-screen" id="chatScreen">
    <div class="header">
      <button onclick="backToList()">←</button>
      <h3 id="chatWith"></h3>
      <button class="call-btn" onclick="alert('Video call coming soon!')">📹</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button class="mic-btn" id="micBtn">🎤</button>
      <button class="btn send" onclick="sendMsg()">Send</button>
    </div>
  </div>
</div>

<script>
// ====== 1. PASTE YOUR FIREBASE CONFIG HERE ======
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
  projectId: "linkup-chat-3fdd5",
  storageBucket: "linkup-chat-3fdd5.appspot.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

let myName = "";
let currentChat = "";
let recorder;
let isRecording = false;

// ====== 2. AUTO GENERATE ID ======
function generateId() {
  let num = Math.floor(1000 + Math.random() * 9000);
  return `LinkUp_${num}`;
}

if(localStorage.getItem('linkupId')) {
  myName = localStorage.getItem('linkupId');
} else {
  myName = generateId();
  localStorage.setItem('linkupId', myName);
}
document.getElementById('myId').innerText = myName;
document.getElementById('myHeaderId').innerText = myName;

function copyId() {
  navigator.clipboard.writeText(myName);
  alert("ID Copied: " + myName);
}

function startApp() {
  db.ref('online/' + myName).set(true);
  document.getElementById('login').style.display = 'none';
  document.getElementById('chatList').style.display = 'flex';
}

function newChat() {
  let friend = document.getElementById('newChatId').value.trim();
  if(!friend) return alert("Enter friend ID");
  currentChat = [myName, friend].sort().join('_');
  openChat(friend);
  document.getElementById('newChatId').value = '';
}

function openChat(friend) {
  document.getElementById('chatList').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('chatWith').innerText = friend;
  
  db.ref('chats/' + currentChat).on('value', snap => {
    let html = '';
    snap.forEach(child => {
      let m = child.val();
      if(m.type === 'voice') {
        html += `<div class="msg ${m.from === myName ? 'me' : ''}">🎤 <audio controls src="${m.url}"></audio></div>`;
      } else {
        html += `<div class="msg ${m.from === myName ? 'me' : ''}"><b>${m.from}:</b> ${m.text}</div>`;
      }
    });
    document.getElementById('messages').innerHTML = html;
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  });
}

function sendMsg() {
  let text = document.getElementById('msgInput').value.trim();
  if(!text) return;
  db.ref('chats/' + currentChat).push({from: myName, text: text, type: 'text', time: Date.now()});
  document.getElementById('msgInput').value = '';
}

// ====== 3. VOICE NOTE WITH FIREBASE STORAGE ======
const micBtn = document.getElementById('micBtn');
micBtn.onmousedown = startRecord;
micBtn.onmouseup = stopRecord;
micBtn.ontouchstart = startRecord;
micBtn.ontouchend = stopRecord;

function startRecord() {
  if(isRecording) return;
  isRecording = true;
  micBtn.classList.add('recording');
  navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
    recorder = new MediaRecorder(stream);
    let chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      let blob = new Blob(chunks, {type: 'audio/webm'});
      let fileName = `voice/${currentChat}/${Date.now()}.webm`;
      let uploadTask = storage.ref(fileName).put(blob);
      uploadTask.then(snapshot => {
        snapshot.ref.getDownloadURL().then(url => {
          db.ref('chats/' + currentChat).push({from: myName, type: 'voice', url: url, time: Date.now()});
        });
      });
    };
    recorder.start();
  });
}

function stopRecord() {
  if(!isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  if(recorder) recorder.stop();
}

function backToList() {
  db.ref('chats/' + currentChat).off();
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('chatList').style.display = 'flex';
}
</script>
</body>
</html>
