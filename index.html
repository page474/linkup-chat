<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkUp Chat</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #f0f2f5; }
body.dark { background: #111b21; color: #e9edef; }
.container { max-width: 600px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
.login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; gap: 15px; }
.login h1 { color: #25D366; font-size: 36px; }
.login input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
.btn { background: #25D366; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
.chat-list, .chat-screen { display: none; flex: 1; flex-direction: column; }
.header { background: #128C7E; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
.chat-item { padding: 15px; border-bottom: 1px solid #e9edef; cursor: pointer; }
.messages { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; }
.msg { background: white; padding: 8px 12px; margin: 8px 0; border-radius: 8px; max-width: 75%; }
.msg.me { background: #d9fdd3; margin-left: auto; }
.input-area { display: flex; padding: 10px; background: white; gap: 8px; }
.input-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; }
</style>
</head>
<body>
<div class="container">
  <div class="login" id="login">
    <h1>LinkUp Chat</h1>
    <p>Real-time chat with Firebase</p>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button class="btn" onclick="startApp()">Start Chatting</button>
  </div>

  <div class="chat-list" id="chatList">
    <div class="header">
      <h2>LinkUp</h2>
      <button onclick="logout()" style="background:none;border:none;color:white;">Logout</button>
    </div>
    <div style="padding:10px;">
      <input type="text" id="newChatName" placeholder="Friend's name" style="width:70%; padding:10px;">
      <button class="btn" onclick="newChat()" style="width:28%;">New Chat</button>
    </div>
    <div id="chats"></div>
  </div>

  <div class="chat-screen" id="chatScreen">
    <div class="header">
      <button onclick="backToList()" style="background:none;border:none;color:white;font-size:20px;">←</button>
      <h3 id="chatWith"></h3>
      <div></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMsg()">
      <button class="btn" onclick="sendMsg()" style="width:80px;">Send</button>
    </div>
  </div>
</div>

<script>
// YOUR FIREBASE CONFIG FROM SCREENSHOT
const firebaseConfig = {
  apiKey: "AIzaSyDyHqEncYDaQs", // COPY FULL ONE FROM YOUR SCREENSHOT
  authDomain: "linkup-chat-3fd.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fd-default-rtdb.firebaseio.com",
  projectId: "Linkup-chat-3fdd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myName = "";
let currentChat = "";

function startApp() {
  myName = document.getElementById('nameInput').value.trim();
  if(!myName) return alert("Enter your name");
  document.getElementById('login').style.display = 'none';
  document.getElementById('chatList').style.display = 'flex';
}

function newChat() {
  let friend = document.getElementById('newChatName').value.trim();
  if(!friend) return alert("Enter friend name");
  currentChat = [myName, friend].sort().join('_');
  openChat(friend);
  document.getElementById('newChatName').value = '';
}

function openChat(friend) {
  document.getElementById('chatList').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('chatWith').innerText = friend;
  
  db.ref('chats/' + currentChat).on('value', snap => {
    let msgs = [];
    snap.forEach(child => msgs.push(child.val()));
    let html = '';
    msgs.forEach(m => {
      html += `<div class="msg ${m.from === myName ? 'me' : ''}"><b>${m.from}:</b> ${m.text}</div>`;
    });
    document.getElementById('messages').innerHTML = html;
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  });
}

function sendMsg() {
  let text = document.getElementById('msgInput').value.trim();
  if(!text) return;
  db.ref('chats/' + currentChat).push({from: myName, text: text, time: Date.now()});
  document.getElementById('msgInput').value = '';
}

function backToList() {
  db.ref('chats/' + currentChat).off();
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('chatList').style.display = 'flex';
}

function logout() { location.reload(); }
</script>
</body>
</html>
