<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#00BFA6">
<title>LinkUp</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0E13;color:white}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:#0A0E13;display:flex;align-items:center;justify-content:center;flex-direction:column}
.logo{width:90px;height:90px;border-radius:28px;background:#00BFA6;display:flex;align-items:center;justify-content:center;color:#00110d;font-size:38px;font-weight:900;box-shadow:0 15px 50px rgba(0,191,166,.25)}
.logoText{margin-top:18px;font-size:30px;font-weight:800;letter-spacing:-1px}
.loading{width:120px;height:4px;margin-top:25px;background:#1E2A36;border-radius:20px;overflow:hidden}
.loading span{display:block;height:100%;width:40%;background:#00BFA6;animation:load 1.2s infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

/* AUTH */
#authScreen{position:fixed;inset:0;background:#0A0E13;z-index:9000;overflow-y:auto}
.authBox{width:min(420px,92%);margin:auto;padding:45px 0}
.authLogo{width:70px;height:70px;border-radius:22px;background:#00BFA6;color:#00110d;display:flex;justify-content:center;align-items:center;font-size:30px;font-weight:900;margin:20px auto}
.authTitle{text-align:center;font-size:28px;font-weight:800}
.authSub{text-align:center;color:#8A9BA8;margin:8px 0 30px}
.authCard{background:#121A22;border:1px solid #1E2A36;padding:22px;border-radius:18px}
.authCard input{width:100%;background:#0A0E13;color:#fff;border:1px solid #263442;padding:15px;border-radius:11px;outline:none;margin-bottom:12px}
.authCard input:focus{border-color:#00BFA6}
.primaryBtn{width:100%;border:0;padding:15px;border-radius:11px;background:#00BFA6;color:#00110d;font-weight:800}
.secondaryBtn{width:100%;border:0;padding:14px;border-radius:11px;background:#1E2A36;color:white;margin-top:10px}
.authSwitch{text-align:center;color:#8A9BA8;margin-top:18px;font-size:14px}
.authSwitch span{color:#00BFA6;font-weight:bold;cursor:pointer}

/* APP */
#app{height:100%;display:flex;flex-direction:column}
.screen{height:100%;display:flex;flex-direction:column;min-height:0}
.header{height:62px;flex-shrink:0;background:#121A22;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #1E2A36;gap:13px}
.header h1{font-size:21px;flex:1}
.headerAction{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:white;font-size:23px}
.headerAction:active{background:#1E2A36}

/* CHATS */
.searchBox{padding:10px 12px;background:#121A22;border-bottom:1px solid #1E2A36}
.searchBox input{width:100%;background:#0A0E13;color:white;border:1px solid #263442;border-radius:22px;padding:11px 16px;outline:none}
.chatList{flex:1;overflow-y:auto}
.chatItem{display:flex;align-items:center;gap:13px;padding:13px 15px;border-bottom:1px solid #17222d;cursor:pointer}
.chatItem:active{background:#121A22}
.avatar{width:52px;height:52px;min-width:52px;border-radius:50%;background:#00BFA6;color:#00110d;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.chatInfo{min-width:0;flex:1}
.chatName{font-weight:700;margin-bottom:4px}
.lastMessage{color:#8A9BA8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.empty{flex:1;display:flex;justify-content:center;align-items:center;flex-direction:column;color:#71808d;text-align:center;padding:30px}
.emptyIcon{font-size:55px;margin-bottom:15px;opacity:.5}
.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border-radius:50%;border:0;background:#00BFA6;color:#00110d;font-size:30px;box-shadow:0 8px 25px rgba(0,0,0,.35);z-index:50}

/* CHAT */
#chatScreen{background:#0A0E13}
.chatHeaderInfo{flex:1;min-width:0}
.chatHeaderName{font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:5px;background:#0A0E13}
.message{max-width:78%;padding:9px 11px;border-radius:12px;background:#1E2A36;align-self:flex-start;word-break:break-word}
.message.me{align-self:flex-end;background:#005C4B}
.inputArea{flex-shrink:0;background:#121A22;border-top:1px solid #1E2A36;padding:9px 10px;display:flex;align-items:center;gap:7px}
.messageInputBox{flex:1;background:#0A0E13;border:1px solid #263442;border-radius:24px;padding:11px 15px}
.messageInputBox input{width:100%;background:transparent;border:0;outline:0;color:white}
.sendBtn{width:44px;height:44px;border-radius:50%;border:0;background:#00BFA6;color:#00110d;font-size:19px}

/* BOTTOM NAV */
.bottomNav{height:60px;flex-shrink:0;background:#121A22;border-top:1px solid #1E2A36;display:flex}
.navItem{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#71808d;font-size:11px;cursor:pointer}
.navIcon{font-size:20px}
.navItem.active{color:#00BFA6}

/* SETTINGS */
.settingsScroll{flex:1;overflow-y:auto}
.profileCard{padding:22px 18px;display:flex;align-items:center;gap:15px;background:#121A22;border-bottom:1px solid #1E2A36}
.profileAvatar{width:64px;height:64px;border-radius:50%;background:#00BFA6;color:#00110d;display:flex;justify-content:center;align-items:center;font-size:25px;font-weight:bold}
.profileId{font-size:17px;font-weight:bold}
.profileSub{color:#71808d;font-size:13px;margin-top:4px}
.sectionTitle{padding:18px 18px 8px;color:#00BFA6;font-size:12px;font-weight:bold;text-transform:uppercase}
.settingItem{background:#121A22;padding:15px 18px;display:flex;align-items:center;border-bottom:1px solid #1E2A36;cursor:pointer}
.settingIcon{width:40px;height:40px;border-radius:11px;background:#1E2A36;display:flex;justify-content:center;align-items:center;margin-right:14px;font-size:19px}
.settingText{flex:1}
.settingTitle{font-size:15px}

/* POPUP */
.popup{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:500;display:flex;justify-content:center;align-items:center;padding:20px}
.popupBox{width:min(410px,100%);background:#121A22;border:1px solid #263442;border-radius:18px;padding:20px}
.popupBox h2{margin-bottom:8px}
.popupSub{color:#71808d;font-size:13px;margin-bottom:15px}
.popupBox input{width:100%;padding:14px;border-radius:10px;background:#0A0E13;color:#fff;border:1px solid #263442;outline:none;margin-bottom:10px}
.popupBtn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold}
.cancelBtn{margin-top:9px;background:#1E2A36;color:white}
</style>
</head>

<body>

<div id="splash"><div class="logo">L</div><div class="logoText">LinkUp</div><div class="loading"><span></span></div></div>

<div id="authScreen" class="hidden">
  <div class="authBox">
    <div class="authLogo">L</div>
    <div class="authTitle" id="authTitle">Welcome to LinkUp</div>
    <div class="authSub" id="authSubtitle">Connect with people instantly</div>
    <div class="authCard">
      <input id="authName" type="text" placeholder="Your name">
      <input id="authEmail" type="email" placeholder="Email address">
      <input id="authPassword" type="password" placeholder="Password">
      <button class="primaryBtn" id="authButton" onclick="handleAuth()">Create Account</button>
      <button class="secondaryBtn" onclick="resetPass()">Forgot password?</button>
    </div>
    <div class="authSwitch"><span id="authSwitchText">Already have an account?</span> <span onclick="toggleAuth()" id="authSwitchButton">Login</span></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="chatsScreen" class="screen">
    <div class="header"><h1>Chats</h1><button class="headerAction" onclick="showNewChat()">＋</button></div>
    <div class="searchBox"><input id="chatSearch" type="text" placeholder="Search chats..."></div>
    <div id="chatList" class="chatList"><div class="empty" id="emptyChats"><div class="emptyIcon">💬</div><h3>No chats yet</h3><p style="margin-top:7px">Tap + to start</p></div></div>
    <button class="fab" onclick="showNewChat()">＋</button>
  </div>

  <div id="chatScreen" class="screen hidden">
    <div class="header"><button class="headerAction" onclick="backToChats()">←</button><div class="avatar" style="width:42px;height:42px"><span id="chatAvatar">L</span></div><div class="chatHeaderInfo"><div class="chatHeaderName" id="chatWithId">User</div></div></div>
    <div id="messages" class="messages"></div>
    <div class="inputArea">
      <div class="messageInputBox"><input id="msgInput" type="text" placeholder="Message" onkeypress="if(event.key==='Enter') sendMsg()"></div>
      <button class="sendBtn" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <div id="settingsScreen" class="screen hidden">
    <div class="header"><h1>Settings</h1></div>
    <div class="settingsScroll">
      <div class="profileCard"><div class="profileAvatar" id="profileAvatar">L</div><div><div class="profileId" id="profileName">LinkUp User</div><div class="profileSub" id="profileId">LNK-000000</div><div class="profileSub">Your LinkUp ID</div></div></div>
      <div class="sectionTitle">Account</div>
      <div class="settingItem" onclick="logout()"><div class="settingIcon">🚪</div><div class="settingText"><div class="settingTitle" style="color:#ff6b6b">Log Out</div></div></div>
    </div>
  </div>

  <div class="bottomNav">
    <div class="navItem active" id="navChats" onclick="showScreen('chatsScreen')"><div class="navIcon">💬</div><div>Chats</div></div>
    <div class="navItem" id="navSettings" onclick="showScreen('settingsScreen')"><div class="navIcon">⚙️</div><div>Settings</div></div>
  </div>
</div>

<div id="newChatPopup" class="popup hidden">
  <div class="popupBox">
    <h2>New Chat</h2><div class="popupSub">Enter the other person's LinkUp ID.</div>
    <input id="friendIdInput" type="text" placeholder="LNK-123456">
    <button class="popupBtn" style="background:#00BFA6;color:#00110d" onclick="startChat()">Start Chat</button>
    <button class="popupBtn cancelBtn" onclick="hideNewChat()">Cancel</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyhQhEncYDaQscOtMrxz9Uj_-0-6XR-_s",
  authDomain: "linkup-chat-3fdd5.firebaseapp.com",
  databaseURL: "https://linkup-chat-3fdd5-default-rtdb.firebaseio.com",
  projectId: "linkup-chat-3fdd5",
  storageBucket: "linkup-chat-3fdd5.firebasestorage.app",
  messagingSenderId: "177573067619",
  appId: "1:177573067619:web:40e64ae330bb86200e7156"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentChatId = "";
let myLinkUpId = "";

setTimeout(()=> {
  document.getElementById('splash').classList.add('hidden');
  onAuthStateChanged(auth, user => {
    if(user) {
      currentUser = user;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      loadUserData();
    } else {
      document.getElementById('authScreen').classList.remove('hidden');
    }
  })
}, 2000);

let isLogin = false;
window.toggleAuth = () => {
  isLogin =!isLogin;
  document.getElementById('authTitle').innerText = isLogin? "Welcome Back" : "Welcome to LinkUp";
  document.getElementById('authButton').innerText = isLogin? "Login" : "Create Account";
  document.getElementById('authSwitchButton').innerText = isLogin? "Sign Up" : "Login";
  document.getElementById('authName').style.display = isLogin? "none" : "block";
}

window.handleAuth = () => {
  const email = document.getElementById('authEmail').value;
  const pass = document.getElementById('authPassword').value;
  const name = document.getElementById('authName').value;
  if(!email ||!pass) return alert("Fill all fields");

  if(isLogin) {
    signInWithEmailAndPassword(auth, email, pass).catch(e=>alert(e.message));
  } else {
    if(!name) return alert("Enter name");
    createUserWithEmailAndPassword(auth, email, pass).then(cred => {
      myLinkUpId = "LNK-" + Math.floor(100000 + Math.random() * 900000);
      set(ref(db, 'users/' + cred.user.uid), { name, email, id: myLinkUpId });
    }).catch(e=>alert(e.message));
  }
}

function loadUserData() {
  onValue(ref(db, 'users/' + currentUser.uid), snap => {
    const data = snap.val();
    if(data){
      document.getElementById('profileName').innerText = data.name;
      document.getElementById('profileId').innerText = data.id;
      document.getElementById('profileAvatar').innerText = data.name[0];
      myLinkUpId = data.id;
    }
  })
}

window.showScreen = (id) => {
  document.querySelectorAll('.screen').forEach(e=>e.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.navItem').forEach(e=>e.classList.remove('active'));
  if(id==='chatsScreen') document.getElementById('navChats').classList.add('active');
  if(id==='settingsScreen') document.getElementById('navSettings').classList.add('active');
}

window.showNewChat = () => document.getElementById('newChatPopup').classList.remove('hidden');
window.hideNewChat = () => document.getElementById('newChatPopup').classList.add('hidden');

window.startChat = () => {
  const friendId = document.getElementById('friendIdInput').value.toUpperCase();
  if(!friendId) return alert("Enter ID");
  currentChatId = [myLinkUpId, friendId].sort().join('_');
  document.getElementById('chatWithId').innerText = friendId;
  document.getElementById('chatAvatar').innerText = friendId[4];
  showScreen('chatScreen');
  hideNewChat();
  loadMessages();
}

window.backToChats = () => showScreen('chatsScreen');

window.sendMsg = () => {
  const text = document.getElementById('msgInput').value;
  if(!text) return;
  push(ref(db, 'chats/' + currentChatId), { sender: myLinkUpId, text, time: Date.now() });
  document.getElementById('msgInput').value = "";
}

function loadMessages() {
  onValue(ref(db, 'chats/' + currentChatId), snap => {
    const msgs = snap.val();
    const box = document.getElementById('messages');
    box.innerHTML = "";
    if(msgs) Object.values(msgs).forEach(m => {
      const div = document.createElement('div');
      div.className = 'message ' + (m.sender === myLinkUpId? 'me' : '');
      div.innerText = m.text;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  })
}

window.logout = () => signOut(auth);
window.resetPass = () => alert("Password reset coming soon");
</script>
</body>
                          </html>
